name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-test-check:
    runs-on: ubuntu-latest
    env:
      SHOPIFY_API_KEY: test
      SHOPIFY_API_SECRET: test
      SCOPES: read_products,write_products
      SHOPIFY_APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://user:password@localhost:5432/winshirt_raffle
      SESSION_SECRET: test_secret_123456789

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Check
        run: npm run check
